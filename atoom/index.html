<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F45D3">

<meta name="mobile-web-app-capable" content="yes">

<title>Atoom Systeem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Atoom: je dagelijkse systeem op basis van de wijsheden uit Atomic Habits. Leer, ontwerp, stem en review.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: één smalle kolom (telefoon), sticky kop, vaste tabbalk onderin, sheets schuiven over het scherm. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --sunk:#E8ECF5; --ink:#141A2E; --muted:#5A627F; --line:#DCE1EE;
  --accent:#2F45D3; --accent-ink:#FFFFFF; --accent-soft:#E3E7FB;
  --spark:#E59A0B; --spark-soft:#FCEFD4;
  --good:#1D9468; --warn:#C9741E; --bad:#C2413A;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1120; --surface:#161B2F; --sunk:#1D2340; --ink:#E7EBF7; --muted:#97A0BF; --line:#272F50;
  --accent:#7D8DFF; --accent-ink:#0D1120; --accent-soft:#212A52;
  --spark:#FFBF47; --spark-soft:#3A2F17;
  --good:#4CC798; --warn:#F0A65B; --bad:#F27B70; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#161B2F; --sunk:#1D2340; --ink:#E7EBF7; --muted:#97A0BF; --line:#272F50;
  --accent:#7D8DFF; --accent-ink:#0D1120; --accent-soft:#212A52;
  --spark:#FFBF47; --spark-soft:#3A2F17;
  --good:#4CC798; --warn:#F0A65B; --bad:#F27B70; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:580px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:8px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}

/* kop */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.02em}
.brand svg{width:28px;height:28px}
.top .date{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* typografie */
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,7vw,34px);line-height:1.12;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.2}
h3{font-size:17px;font-weight:700;line-height:1.3}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

/* blokken */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.soft{background:var(--accent-soft);border-color:transparent}
.quote{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.3;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);line-height:1.25}
.stat.spark b{color:var(--spark)}

/* knoppen */
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;line-height:1.3;text-align:left}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.cat{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em}

/* formulier */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;line-height:1.4;font-weight:400}
textarea{resize:vertical;min-height:72px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.tip{background:var(--spark-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.tip b{color:var(--ink)}

/* gewoonte-rij */
.habits{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 10px}
.check{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s}
.check svg{width:22px;height:22px}
.hrow.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hrow.break .check{border-style:dashed}
.hrow.break.done .check{background:var(--good);border-color:var(--good);border-style:solid}
.hbody{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.hname{font-weight:700;font-size:16px;line-height:1.25}
.hmeta{font-size:13px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.dots{display:flex;gap:4px;margin-top:2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--sunk);display:block}
.dots i.on{background:var(--accent)}
.hrow.break .dots i.on{background:var(--good)}
.dots i.now{outline:1.5px solid var(--muted);outline-offset:1px}
.streak{font-family:var(--f-mono);font-weight:600;font-size:18px;color:var(--spark);text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.streak small{font-size:11px;color:var(--muted);display:block;font-weight:400;margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.badge.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.alert{border-left:0;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}

/* reis */
.progress{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
.phase{display:flex;flex-direction:column;gap:8px}
.stage{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.stage .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--sunk);color:var(--muted)}
.stage.done .num{background:var(--good);color:#fff}
.stage.next{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stage.next .num{background:var(--accent);color:var(--accent-ink)}
.stage .t{font-weight:700;line-height:1.25}
.stage .s{font-size:13px;color:var(--muted);line-height:1.3}
.chev{color:var(--muted)}

/* wijsheid */
.concept{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;width:100%}
.concept .kern{font-size:14px;color:var(--muted);line-height:1.4}
ul.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* scorecard */
.sc{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sc:last-child{border-bottom:0}
.rate{display:flex;gap:4px}
.rate button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-weight:600}
.rate button.on.p{background:var(--good);border-color:var(--good);color:#fff}
.rate button.on.n{background:var(--bad);border-color:var(--bad);color:#fff}
.rate button.on.e{background:var(--muted);border-color:var(--muted);color:var(--bg)}
.x{width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:20px}

/* grid 35 dagen */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{aspect-ratio:1;border-radius:6px;background:var(--sunk);display:block;max-width:100%}
.cal i.on{background:var(--accent)}
.cal i.fut{background:transparent;border:1px dashed var(--line)}
.cal.break i.on{background:var(--good)}

/* contract */
.contract{font-size:16px;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.contract b{font-weight:700;background:var(--accent-soft);padding:0 4px;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
dl.kv{margin:0;display:flex;flex-direction:column;gap:10px}
dl.kv div{display:flex;flex-direction:column;gap:2px}
dl.kv dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
dl.kv dd{margin:0}

/* grafiek */
.chart svg{width:100%;height:auto;display:block;max-width:100%}
.chart text{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}

/* tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:580px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:var(--accent)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);animation:up .22s ease-out}
.sheet .wrap{padding-block:8px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);padding-block:10px;z-index:2}
.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1}
.steps{display:flex;gap:4px;flex:1}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--sunk)}
.steps i.on{background:var(--accent)}
.foot{display:flex;gap:10px}
.foot .btn{flex:1}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.18)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease-out}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
"use strict";

/* ============================ KENNIS ============================ */
const CONCEPTS = [
 {id:"procent",cat:"Fundament",titel:"1% beter per dag",
  kern:"Kleine verbeteringen stapelen zich op als rente: 1% per dag is na een jaar bijna 38 keer beter.",
  uitleg:"Gewoontes zijn de samengestelde rente van zelfverbetering. Eén procent beter valt vandaag niemand op, jou ook niet. Maar 1,01 tot de macht 365 is 37,8. Andersom werkt het net zo hard: 1% slechter per dag brengt je na een jaar naar 0,03. Je resultaten zijn een vertraagde meting van je gewoontes. Kijk dus naar je richting, niet naar waar je vandaag staat.",
  toepassen:["Vraag bij elke keuze: maakt dit me 1% beter of 1% slechter?","Meet de trend, niet het eindpunt.","Zie het als DCA: elke kleine inleg telt, het rendement komt later."],
  vraag:"Welk gebied zou over een jaar het meest veranderen als je er elke dag 1% beter in wordt?"},
 {id:"plateau",cat:"Fundament",titel:"Het plateau van latent potentieel",
  kern:"Resultaten lopen achter op inspanning. Het werk is niet verloren, het wordt opgeslagen.",
  uitleg:"We verwachten dat vooruitgang lineair gaat, maar gewoontes werken met vertraging. In het begin lijkt er niets te gebeuren: het dal van teleurstelling. Een ijsblok smelt pas bij 0 graden, ook als je hem al van −5 naar −1 hebt opgewarmd. Wie in het dal stopt, mist de doorbraak die eraan zat te komen.",
  toepassen:["Verwacht de eerste weken weinig zichtbaar resultaat.","Je tracker is het bewijs dat je opwarmt.","Beoordeel een nieuwe gewoonte pas na minstens acht weken."],
  vraag:"Waar ben je eerder gestopt terwijl je eigenlijk in het dal van teleurstelling zat?"},
 {id:"systemen",cat:"Fundament",titel:"Systemen boven doelen",
  kern:"Je stijgt niet naar het niveau van je doelen. Je zakt naar het niveau van je systemen.",
  uitleg:"Winnaars en verliezers hebben vaak hetzelfde doel. Het verschil zit in het systeem: de dagelijkse processen die tot resultaat leiden. Doelen geven richting, systemen zorgen voor vooruitgang. Doelen hebben ook nadelen: je stelt je geluk uit tot je het doel haalt, en daarna valt je motivatie weg. Verliefd worden op het proces lost dat op.",
  toepassen:["Schrijf achter elk doel het dagelijkse systeem dat het oplevert.","Vier dat je systeem draaide, ook als het resultaat nog uitblijft.","Een trader zonder systeem gokt. Een sporter zonder schema hoopt."],
  vraag:"Wat is je belangrijkste doel van dit jaar, en welk dagelijks systeem hoort erbij?"},
 {id:"identiteit",cat:"Identiteit",titel:"Identiteit eerst",
  kern:"De diepste verandering zit niet in wat je wilt bereiken, maar in wie je wilt worden.",
  uitleg:"Verandering heeft drie lagen: uitkomsten (wat je krijgt), processen (wat je doet) en identiteit (wat je over jezelf gelooft). De meeste mensen beginnen bij uitkomsten. Gewoontes die blijven, beginnen bij identiteit. \"Ik probeer te stoppen met roken\" is iets anders dan \"Ik ben geen roker\". Het doel is niet een marathon lopen, het doel is een hardloper worden.",
  toepassen:["Formuleer gewoontes als \"Ik ben iemand die…\"","Twijfel je? Vraag: wat zou zo iemand nu doen?","Houd je identiteit los genoeg om mee te groeien."],
  vraag:"Wie wil je zijn? Welk type persoon haalt de resultaten die jij wilt?"},
 {id:"stemmen",cat:"Identiteit",titel:"Elke actie is een stem",
  kern:"Elke keer dat je een gewoonte uitvoert, stem je op het type persoon dat je wilt worden.",
  uitleg:"Je identiteit ontstaat uit bewijs. Elke training is een stem voor \"ik ben een sporter\". Je hoeft niet unaniem te winnen, een meerderheid is genoeg. Daarom tellen kleine acties: het zijn stemmen. Het proces heeft twee stappen: bepaal wie je wilt zijn, en bewijs het jezelf met kleine overwinningen.",
  toepassen:["Elke afvinking in Atoom telt als stem. Kijk naar je teller.","Een slechte dag is één stem tegen, geen verloren verkiezing.","Kies acties die voor jou overtuigend bewijs zijn."],
  vraag:"Welke kleine actie is vandaag een stem voor wie je wilt worden?"},

function streak(h){let k=today();if(!h.log[k])k=addDays(k,-1);let n=0;while(h.log[k]){n++;k=addDays(k,-1)}return n}
function best(h){const ks=Object.keys(h.log).sort();let b=0,c=0,prev=null;for(const k of ks){c=(prev&&diff(prev,k)===1)?c+1:1;b=Math.max(b,c);prev=k}return b}
function miss(h){const t=today(),y=addDays(t,-1);if(h.log[t]||h.created>y)return 0;if(h.log[y])return 0;const y2=addDays(t,-2);return (h.created<=y2&&!h.log[y2])?2:1}
function cueText(h){const d=h.d||{};if(h.type==="break")return d.trigger?"Signaal: "+d.trigger:(d.replace?"In plaats daarvan: "+d.replace:"Vermijden");
  const parts=[];if(d.stack)parts.push("Na "+d.stack);if(d.twoMin)parts.push("start: "+d.twoMin);return parts.join(" · ")||"Tik voor details"}
function nextStage(){return STAGES.find(s=>!stageDone(s))}
function stageDone(s){
  const qs=(s.vragen||[]).every(([k])=>ans(k));
  switch(s.kind){
    case "identity":return qs&&S.profile.identities.length>0;
    case "scorecard":return qs&&S.scorecard.length>=5;
    case "build":return S.habits.some(h=>h.type==="build");
    case "break":return S.habits.some(h=>h.type==="break");
    case "votes":return votes()>=7;
    case "review":return S.reviews.length>0;
    case "level":return qs&&S.habits.some(h=>(h.level||1)>1);
    default:return qs;
  }
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400)}
function chipsHTML(list,forId){return list&&list.length?`<div class="chips">${list.map(v=>`<button type="button" class="chip" data-act="chip" data-for="${forId}" data-val="${esc(v)}">${esc(v)}</button>`).join("")}</div>`:""}
function qBlock(k,q){return `<label class="f">${esc(q)}<textarea id="q-${k}" data-ans="${k}" rows="3" placeholder="Schrijf je antwoord…">${esc(S.answers[k]||"")}</textarea></label>`}

/* ============================ GRAFIEK ============================ */
function compoundSVG(day){
  const W=320,H=150,pl=30,pr=40,pt=10,pb=22,iw=W-pl-pr,ih=H-pt-pb,ymax=40;
  const x=d=>pl+d/365*iw,y=v=>pt+ih-v/ymax*ih;
  let up="",dn="";for(let d=0;d<=365;d+=5){const dd=Math.min(d,365);up+=(d?"L":"M")+x(dd).toFixed(1)+" "+y(Math.pow(1.01,dd)).toFixed(1);dn+=(d?"L":"M")+x(dd).toFixed(1)+" "+y(Math.pow(.99,dd)).toFixed(1)}
  up+="L"+x(365).toFixed(1)+" "+y(Math.pow(1.01,365)).toFixed(1);dn+="L"+x(365).toFixed(1)+" "+y(Math.pow(.99,365)).toFixed(1);
  const area=up+"L"+x(365)+" "+y(0)+"L"+x(0)+" "+y(0)+"Z";
  const grid=[0,10,20,30].map(v=>`<line x1="${pl}" x2="${pl+iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${v}×</text>`).join("");
  const xt=[0,90,180,270,365].map(d=>`<text x="${x(d)}" y="${H-6}" text-anchor="middle">${d===0?"dag 0":d}</text>`).join("");
  const dd=Math.min(Math.max(day,0),365),mv=Math.pow(1.01,dd);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Groei bij 1% per dag: na 365 dagen 37,8 keer beter; bij 1% slechter 0,03.">
   ${grid}${xt}
   <path d="${area}" fill="var(--accent)" fill-opacity=".1"/>
   <path d="${up}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>
   <path d="${dn}" fill="none" stroke="var(--bad)" stroke-width="1.8" stroke-dasharray="4 3"/>
   <text x="${x(365)+4}" y="${y(37.8)+3}" style="fill:var(--accent);font-weight:600">37,8×</text>
   <text x="${x(365)+4}" y="${y(0)-2}" style="fill:var(--bad)">0,03×</text>
   <line x1="${x(dd)}" x2="${x(dd)}" y1="${pt}" y2="${y(0)}" stroke="var(--spark)" stroke-width="1" stroke-dasharray="2 2"/>
   <circle cx="${x(dd)}" cy="${y(mv)}" r="5" fill="var(--spark)" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}

function greeting(){const h=new Date().getHours();return h<6?"Goedenacht":h<12?"Goedemorgen":h<18?"Goedemiddag":"Goedenavond"}

  const dn=dayNr();
  const c=CONCEPTS[(diff("2024-01-01",t)%CONCEPTS.length+CONCEPTS.length)%CONCEPTS.length];

  return `
  <section class="stack-s" style="padding-top:4px">

    <div class="sec-head"><h2>Vandaag stemmen</h2>${hs.length?`<button class="link small" data-act="newbuild">+ Nieuw</button>`:""}</div>
    ${hs.length?`<div class="habits">${hs.map(habitRow).join("")}</div>`:
    `<div class="card soft"><h3>Nog geen gewoontes</h3><p class="small">Ontwerp je eerste gewoonte met de vier wetten. Het duurt vijf minuten en je eindigt met een contract met jezelf.</p><button class="btn" data-act="newbuild">Ontwerp mijn eerste gewoonte</button></div>`}
  </section>
  ${ns?`<section class="card"><span class="eyebrow">Volgende stap op je reis · ${esc(ns.fase)}</span><h3>${esc(ns.titel)}</h3><p class="small muted">${esc(ns.intro)}</p><button class="btn quiet" data-act="stage" data-id="${ns.id}">Verder met deze stap</button></section>`:
  `<section class="card soft"><span class="eyebrow">Reis voltooid</span><h3>Je hebt alle stappen doorlopen</h3><p class="small">Blijf stemmen, doe je weekreview en herhaal de kwartaalcheck.</p></section>`}
  <section class="card">
    <span class="eyebrow">Wijsheid van vandaag · ${esc(c.cat)}</span>
    <h3>${esc(c.titel)}</h3>
    <p>${esc(c.kern)}</p>
    <p class="small muted"><b>Vraag aan jou:</b> ${esc(c.vraag)}</p>
    <button class="link" data-act="concept" data-id="${c.id}">Lees en beantwoord →</button>
  </section>
  <section class="card">
    <div class="sec-head"><h3>Jouw rentecurve</h3><span class="eyebrow">dag ${dn}</span></div>
    <div class="chart">${compoundSVG(dn)}</div>
    <p class="small muted">Op dag ${dn} staat 1% per dag op <b style="color:var(--spark)">${nl(Math.pow(1.01,Math.min(dn,365)))}×</b>. Het meeste rendement zit in het tweede halfjaar. Blijf stemmen.</p>
  </section>`;
}

function habitRow(h){
  const t=today(),done=!!h.log[t],st=streak(h);
  let dots="";for(let i=6;i>=0;i--){const k=addDays(t,-i);dots+=`<i class="${h.log[k]?"on":""} ${i===0?"now":""}"></i>`}
  return `<div class="hrow ${done?"done":""} ${h.type==="break"?"break":""}">
    <button class="check" data-act="toggle" data-id="${h.id}" aria-pressed="${done}" aria-label="${esc(h.name)} ${h.type==="break"?"vandaag vermeden":"vandaag gedaan"}">${ICON_CHECK}</button>
    <button class="hbody" data-act="habit" data-id="${h.id}">
      <span class="hname">${esc(h.name)}${(h.level||1)>1?` <span class="badge acc">lvl ${h.level}</span>`:""}</span>
      <span class="hmeta">${h.type==="break"?"Vermijden · ":""}${esc(cueText(h))}</span>
      <span class="dots" aria-hidden="true">${dots}</span>
    </button>
    <span class="streak">${st}<small>reeks</small></span>
  </div>`;
}

  <section class="stack-s" style="padding-top:4px">

    <h1>Van inzicht naar systeem</h1>
    <p class="muted">Tien stappen in zes fases. Elke stap legt een wijsheid uit en stelt je vragen. Je antwoorden worden je systeem.</p>
  </section>
  <section class="stack-s">
    <div class="sec-head"><span class="small"><b>${doneN}</b> van ${STAGES.length} stappen klaar</span><span class="eyebrow">${Math.round(doneN/STAGES.length*100)}%</span></div>
    <div class="progress"><i style="width:${doneN/STAGES.length*100}%"></i></div>

  </section>`).join("")}`;
}

function weekStats(){
  const t=today(),ws=weekStart(t);
  const days=[];for(let i=0;i<7;i++)days.push(addDays(ws,i));
  const hs=active();
  return {ws,days,rows:hs.map(h=>({h,n:days.filter(d=>h.log[d]).length,poss:days.filter(d=>d<=t&&d>=h.created).length}))};
}

  const {ws,rows}=weekStats();
  const thisWeek=S.reviews.find(r=>r.week===ws);

  return `

    <button class="btn block" type="submit">Review opslaan</button></form>`}

const VIEWS={vandaag:vVandaag,reis:vReis,gewoontes:vGewoontes,wijsheid:vWijsheid,review:vReview};
const route=()=>{const h=location.hash.slice(1);return VIEWS[h]?h:"vandaag"};

function render(){
  const r=route();
  $("#main").innerHTML=VIEWS[r]();
  document.querySelectorAll(".tabs a").forEach(a=>a.classList.toggle("on",a.dataset.tab===r));
  $("#hdate").textContent=new Date().toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"});
}

/* ============================ SHEETS ============================ */
function openSheet(o){SH=o;renderSheet();$("#sheet").hidden=false;$("#sheet").scrollTop=0;document.body.style.overflow="hidden"}
function closeSheet(){SH=null;W=null;CONF=null;$("#sheet").hidden=true;document.body.style.overflow="";render()}
function renderSheet(){
  if(!SH)return;
  const top=`<div class="sheet-top">${SH.kind==="wizard"?stepsBar():`<span class="eyebrow">${esc(SH.label||"")}</span>`}<button class="close" data-act="close" aria-label="Sluiten">×</button></div>`;
  let body="";
  if(SH.kind==="concept")body=sConcept();
  else if(SH.kind==="stage")body=sStage();
  else if(SH.kind==="wizard")body=sWizard();
  else if(SH.kind==="habit")body=sHabit();
  $("#sheet").innerHTML=`<div class="wrap">${top}${body}</div>`;
}

function sConcept(){
  const c=concept(SH.id);
  const law=/^wet/.test(c.id)?"newbuild":/^inv/.test(c.id)?"newbreak":"";
  return `<span class="eyebrow">${esc(c.cat)}</span><h1>${esc(c.titel)}</h1>
   <p class="quote">${esc(c.kern)}</p>
   <p>${esc(c.uitleg)}</p>
   ${c.id==="procent"?`<div class="card chart">${compoundSVG(dayNr())}</div>`:""}
   <section class="card"><span class="eyebrow">Zo pas je het toe</span><ul class="list">${c.toepassen.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>
   <section class="card soft"><span class="eyebrow">Vraag aan jou</span>${qBlock("c_"+c.id,c.vraag)}<span class="hint">Je antwoord wordt automatisch bewaard.</span></section>
   ${law?`<button class="btn block" data-act="${law}">${law==="newbuild"?"Ontwerp een gewoonte met deze wet":"Breek een gewoonte met deze inversie"}</button>`:""}`;
}

function sStage(){
  const s=STAGES.find(x=>x.id===SH.id),d=stageDone(s),i=STAGES.indexOf(s)+1;
  let special="";
  if(s.kind==="identity"){
    special=`<section class="card"><span class="eyebrow">Ik ben iemand die…</span>
      ${S.profile.identities.map((t,j)=>`<div class="sc" style="grid-template-columns:1fr auto"><span>${esc(t)}</span><button class="x" data-act="iddel" data-i="${j}" aria-label="Verwijder">×</button></div>`).join("")||`<p class="small muted">Nog geen identiteit.</p>`}
      <form class="stack-s" data-form="id"><input type="text" id="id-new" placeholder="Ik ben iemand die…"><button class="btn quiet" type="submit">Voeg toe</button></form>
      ${chipsHTML(IDENTITY_CHIPS.filter(c=>!S.profile.identities.includes(c)),"id-new")}
      <span class="hint">Tip: beschrijf eigenschappen in plaats van rollen. Dat groeit mee.</span></section>`;
  }
  if(s.kind==="scorecard"){
    const sym={p:"+",e:"=",n:"−"};
    special=`<section class="card"><div class="sec-head"><span class="eyebrow">Mijn dag</span><span class="eyebrow">${S.scorecard.length}/5+</span></div>
      ${S.scorecard.map((it,j)=>`<div class="sc"><span>${esc(it.t)}</span><span class="rate">${["p","e","n"].map(r=>`<button class="${r} ${it.r===r?"on":""}" data-act="rate" data-i="${j}" data-r="${r}" aria-label="${sym[r]}">${sym[r]}</button>`).join("")}</span><button class="x" data-act="scdel" data-i="${j}" aria-label="Verwijder">×</button></div>`).join("")}
      <form class="stack-s" data-form="score"><input type="text" id="sc-new" placeholder="bijv. Telefoon checken in bed"><button class="btn quiet" type="submit">Voeg toe</button></form>
      <div class="chips">${SCORE_CHIPS.filter(c=>!S.scorecard.some(x=>x.t===c)).map(c=>`<button class="chip" data-act="scadd" data-val="${esc(c)}">+ ${esc(c)}</button>`).join("")}</div>
      <span class="hint">Twijfel je bij een +, = of −? Vraag: helpt dit me de persoon te worden die ik wil zijn?</span></section>`;
  }
  if(s.kind==="build"||s.kind==="break"){
    const list=S.habits.filter(h=>h.type===s.kind);
    special=`${list.length?`<div class="habits">${list.map(habitRow).join("")}</div>`:""}<button class="btn block" data-act="${s.kind==="build"?"newbuild":"newbreak"}">${s.kind==="build"?"Ontwerp een gewoonte":"Breek een gewoonte"}</button>`;
  }
  if(s.kind==="votes"){const v=Math.min(votes(),7);special=`<section class="card"><div class="sec-head"><h3>${v} van 7 stemmen</h3></div><div class="progress"><i style="width:${v/7*100}%;background:var(--spark)"></i></div><button class="btn quiet" data-act="goto" data-val="vandaag">Naar Vandaag</button></section>`}
  if(s.kind==="review")special=`<button class="btn block" data-act="goto" data-val="review">Naar weekreview</button>`;
  if(s.kind==="level"){const hs=active();special=hs.length?`<section class="stack-s"><span class="eyebrow">Open een gewoonte om hem een level hoger te zetten</span><div class="habits">${hs.map(habitRow).join("")}</div></section>`:`<p class="small muted">Bouw eerst een gewoonte.</p>`}
  return `<span class="eyebrow">Stap ${i} · ${esc(s.fase)}</span><h1>${esc(s.titel)}</h1>
   <p>${esc(s.intro)}</p>
   <section class="stack-s">${s.concepts.map(id=>{const c=concept(id);return `<button class="concept" data-act="concept" data-id="${id}"><span class="eyebrow">Wijsheid</span><h3>${esc(c.titel)}</h3><span class="kern">${esc(c.kern)}</span></button>`}).join("")}</section>
   ${special}
   ${(s.vragen||[]).length?`<section class="card"><span class="eyebrow">Vragen aan jou</span>${s.vragen.map(([k,q])=>qBlock(k,q)).join("")}<span class="hint">Antwoorden worden automatisch bewaard.</span></section>`:""}
   <div class="row">${d?`<span class="badge good">Stap afgerond</span>`:`<span class="badge">Nog niet afgerond</span>`}</div>
   <button class="btn ghost block" data-act="close">Terug</button>`;
}

function stepsBar(){const def=W.type==="build"?BUILD:BREAK;return `<div class="steps">${def.map((_,i)=>`<i class="${i<=W.step?"on":""}"></i>`).join("")}</div>`}
function contractHTML(type,d,name){
  name=name?name.charAt(0).toLowerCase()+name.slice(1):name;
  const b=v=>`<b>${esc(v)}</b>`;
  if(type==="build"){
    const p=[];
    if(d.identity)p.push(`${b(d.identity)}.`);
    p.push(`Na ${b(d.stack||"…")} ga ik ${b(name||"…")}${d.where?` doen, ${b(d.where)}`:""}.`);
    if(d.twoMin)p.push(`Ik begin met ${b(d.twoMin)}.`);
    if(d.cue)p.push(`Mijn signaal: ${b(d.cue)}.`);
    if(d.friction)p.push(`Ik maak het makkelijk: ${b(d.friction)}.`);
    if(d.bundle)p.push(`Tijdens of na afloop mag ik ${b(d.bundle)}.`);
    if(d.reframe)p.push(`${b(d.reframe)}.`);
    if(d.tribe)p.push(`Dit is normaal bij ${b(d.tribe)}.`);
    if(d.reward)p.push(`Mijn directe beloning: ${b(d.reward)}.`);
    if(d.partner)p.push(`${b(d.partner)} houdt me scherp.`);
    return p.join(" ");
  }
  const p=[`Ik stop met ${b(name||"…")}.`];
  if(d.trigger)p.push(`Het signaal is ${b(d.trigger)}.`);
  if(d.motive)p.push(`Eigenlijk zoek ik ${b(d.motive)}.`);
  if(d.invisible)p.push(`Ik maak het onzichtbaar: ${b(d.invisible)}.`);
  if(d.cost)p.push(`Het kost me ${b(d.cost)}.`);
  if(d.benefit)p.push(`Als ik het vermijd, win ik ${b(d.benefit)}.`);
  if(d.friction)p.push(`Ik maak het moeilijk: ${b(d.friction)}.`);
  if(d.replace)p.push(`In plaats daarvan ga ik ${b(d.replace)}.`);
  if(d.contract)p.push(`${b(d.contract)}.`);
  if(d.partner)p.push(`${b(d.partner)} mag me aanspreken.`);
  return p.join(" ");
}
function sWizard(){
  const def=W.type==="build"?BUILD:BREAK,st=def[W.step],last=W.step===def.length-1;
  let body;
  if(st.summary){
    body=`<p class="muted">Lees het hardop. Dit is je afspraak met jezelf.</p><div class="contract">${contractHTML(W.type,W.data,W.data.name)}</div>
      <p class="hint">${W.type==="build"?"Vink de gewoonte elke dag af op Vandaag. Elke vink is een stem.":"Vink elke dag af dat je de gewoonte hebt vermeden."}</p>`;
  }else{
    body=(st.tip?`<div class="tip">${st.tip}</div>`:"")+st.fields.map(f=>{const id="wf-"+f.k,ch=typeof f.chips==="function"?f.chips():f.chips;
      return `<div class="stack-s"><label class="f" for="${id}">${esc(f.label)}</label><input type="text" id="${id}" data-wf="${f.k}" value="${esc(W.data[f.k]||"")}" placeholder="${esc(f.ph||"")}">${chipsHTML(ch,id)}</div>`}).join("");
  }
  return `<span class="eyebrow">${esc(st.law)} · stap ${W.step+1} van ${def.length}</span><h1>${esc(st.t)}</h1>
   ${st.intro?`<p class="muted">${esc(st.intro)}</p>`:""}
   ${st.concept&&!st.summary?`<button class="link small" data-act="peek" data-id="${st.concept}">Wat zegt het boek hierover?</button>`:""}
   ${W.peek&&!st.summary?`<div class="card soft small"><b>${esc(concept(W.peek).titel)}</b><p>${esc(concept(W.peek).uitleg)}</p></div>`:""}
   <div class="stack">${body}</div>
   <div class="foot">${W.step>0?`<button class="btn ghost" data-act="wback">Terug</button>`:""}${last?`<button class="btn" data-act="wsave">${W.editId?"Wijzigingen opslaan":"Teken en start"}</button>`:`<button class="btn" data-act="wnext">Volgende</button>`}</div>`;
}

function sHabit(){
  const h=S.habits.find(x=>x.id===SH.id);if(!h)return "<p>Niet gevonden.</p>";
  const t=today(),st=streak(h),bs=best(h),tot=Object.keys(h.log).length;
  const start=addDays(weekStart(t),-28);let cells="";
  for(let i=0;i<35;i++){const k=addDays(start,i);cells+=`<i class="${k>t?"fut":h.log[k]?"on":""}" title="${k}"></i>`}
  const lv=h.level||1,levels=h.levels||[];
  return `<span class="eyebrow">${h.type==="break"?"Breken":"Bouwen"}${h.archived?" · gearchiveerd":""}</span>
   <h1>${esc(h.name)}</h1>
   ${h.d&&h.d.identity?`<p class="quote" style="font-size:17px">${esc(h.d.identity)}</p>`:""}
   <section class="stats"><div class="stat spark"><b>${st}</b><span>huidige reeks</span></div><div class="stat"><b>${bs}</b><span>langste reeks</span></div><div class="stat"><b>${tot}</b><span>stemmen totaal</span></div></section>
   <section class="card"><div class="sec-head"><h3>Laatste 5 weken</h3><span class="eyebrow">ma → zo</span></div><div class="cal ${h.type==="break"?"break":""}">${cells}</div></section>
   <section class="stack-s"><span class="eyebrow">Contract</span><div class="contract">${contractHTML(h.type,h.d||{},h.name)}</div></section>
   ${h.type==="build"?`<section class="card"><div class="sec-head"><h3>Goldilocks · level ${lv}</h3><span class="badge acc">lvl ${lv}</span></div>
     <p class="small muted">Gaat het vanzelf? Maak het net iets moeilijker. Te zwaar? Terug naar de tweeminutenversie.</p>
     ${levels.length?`<ul class="list small">${levels.map(l=>`<li>Level ${l.lv}: ${esc(l.v)} <span class="muted">(${toDate(l.at).toLocaleDateString("nl-NL",{day:"numeric",month:"short"})})</span></li>`).join("")}</ul>`:""}
     <form class="stack-s" data-form="level" data-id="${h.id}"><input type="text" id="lv-new" placeholder="Volgende versie, bijv. 20 minuten in plaats van 10"><button class="btn quiet" type="submit">Level up</button></form></section>`:""}
   <div class="row"><button class="btn quiet" data-act="edit" data-id="${h.id}">Bewerk contract</button>
   <button class="btn ghost" data-act="archive" data-id="${h.id}">${h.archived?"Zet terug":"Archiveer"}</button></div>
   ${CONF==="del"?`<div class="row"><button class="btn danger" data-act="del2" data-id="${h.id}">Ja, verwijder definitief</button><button class="btn ghost" data-act="unconf">Annuleer</button></div>`:`<button class="link" style="color:var(--bad)" data-act="del">Verwijder gewoonte</button>`}`;
}

/* ============================ ACTIES ============================ */
function startWizard(type,editId){
  const h=editId&&S.habits.find(x=>x.id===editId);
  W={type,step:0,editId:editId||null,peek:null,data:h?Object.assign({name:h.name},h.d||{}):{identity:S.profile.identities[0]||""}};
  openSheet({kind:"wizard"});
}
const A={
  close:closeSheet,
  goto:el=>{const v=el.dataset.val;closeSheet();location.hash="#"+v},
  chip:el=>{const inp=document.getElementById(el.dataset.for);if(!inp)return;inp.value=el.dataset.val;inp.dispatchEvent(new Event("input",{bubbles:true}));inp.focus()},
  area:el=>{const v=el.dataset.val,i=OB.areas.indexOf(v);i<0?OB.areas.push(v):OB.areas.splice(i,1);el.classList.toggle("on");el.setAttribute("aria-pressed",i<0)},
  start:()=>{
    S.profile.name=(OB.name||"").trim();S.profile.areas=OB.areas.slice();
    const id=(OB.identity||"").trim();if(id&&!S.profile.identities.includes(id))S.profile.identities.push(id);
    S.profile.started=today();save();render();window.scrollTo(0,0);toast("Je reis is begonnen. Dag 1.");
  },
  toggle:(el,id)=>{
    const h=S.habits.find(x=>x.id===id),t=today();if(!h)return;
    if(h.log[t])delete h.log[t];else{h.log[t]=1;toast(S.profile.identities[0]?"Stem uitgebracht: "+S.profile.identities[0]:"Stem uitgebracht")}
    save();if(SH)renderSheet();render();
    const v=$("#votes");if(v&&h.log[t])v.classList.add("pop");
  },
  habit:(el,id)=>{CONF=null;openSheet({kind:"habit",id,label:"Gewoonte"})},
  concept:(el,id)=>openSheet({kind:"concept",id,label:"Wijsheid"}),
  stage:(el,id)=>openSheet({kind:"stage",id,label:"Reis"}),
  cat:el=>{CAT=el.dataset.val;render()},
  newbuild:()=>startWizard("build"),
  newbreak:()=>startWizard("break"),
  edit:(el,id)=>{const h=S.habits.find(x=>x.id===id);startWizard(h.type,id)},
  peek:(el,id)=>{W.peek=W.peek===id?null:id;renderSheet()},
  wnext:()=>{const def=W.type==="build"?BUILD:BREAK,st=def[W.step];
    const miss=(st.fields||[]).find(f=>f.req&&!(W.data[f.k]||"").trim());
    if(miss){toast("Vul eerst in: "+miss.label.split("?")[0]+"?");document.getElementById("wf-"+miss.k)?.focus();return}
    W.step++;W.peek=null;renderSheet();$("#sheet").scrollTop=0},
  wback:()=>{W.step--;W.peek=null;renderSheet();$("#sheet").scrollTop=0},
  wsave:()=>{
    const d=Object.assign({},W.data),name=(d.name||"").trim();delete d.name;
    Object.keys(d).forEach(k=>{d[k]=(d[k]||"").trim();if(!d[k])delete d[k]});
    if(W.editId){const h=S.habits.find(x=>x.id===W.editId);h.name=name;h.d=d}
    else S.habits.push({id:uid(),type:W.type,name,d,created:today(),log:{},level:1,levels:[]});
    if(d.identity&&W.type==="build"&&!S.profile.identities.includes(d.identity))S.profile.identities.push(d.identity);
    save();const ed=W.editId;closeSheet();if(!ed)location.hash="#vandaag";
    toast(ed?"Contract bijgewerkt":"Getekend. Je eerste stem kan vandaag al.");
  },
  archive:(el,id)=>{const h=S.habits.find(x=>x.id===id);h.archived=!h.archived;save();renderSheet();toast(h.archived?"Gearchiveerd":"Teruggezet")},
  del:()=>{CONF="del";renderSheet()},
  del2:(el,id)=>{S.habits=S.habits.filter(x=>x.id!==id);save();closeSheet();toast("Verwijderd")},
  unconf:()=>{CONF=null;SH?renderSheet():render()},
  iddel:el=>{S.profile.identities.splice(+el.dataset.i,1);save();renderSheet()},
  rate:el=>{const it=S.scorecard[+el.dataset.i];it.r=it.r===el.dataset.r?"":el.dataset.r;save();renderSheet()},
  scdel:el=>{S.scorecard.splice(+el.dataset.i,1);save();renderSheet()},
  scadd:el=>{S.scorecard.push({t:el.dataset.val,r:""});save();renderSheet()},
  copy:()=>{const ta=$("#backup");const done=()=>toast("Back-up gekopieerd");
    try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();toast("Tekst geselecteerd, kopieer handmatig")})}catch(e){ta.select();toast("Tekst geselecteerd, kopieer handmatig")}},
  import:()=>{try{const o=JSON.parse($("#imp").value);if(!o||!Array.isArray(o.habits))throw 0;const b=blank();S=Object.assign(b,o,{profile:Object.assign(b.profile,o.profile||{})});save();render();toast("Back-up teruggezet")}catch(e){toast("Dit lijkt geen geldige back-up. Plak de volledige tekst.")}},
  reset:()=>{CONF="reset";render()},
  reset2:()=>{S=blank();CONF=null;RV={};save();location.hash="#vandaag";render();toast("Alles gewist")}
};
const FORMS={
  id:f=>{const i=$("#id-new"),v=i.value.trim();if(!v)return;S.profile.identities.push(v);save();renderSheet()},
  score:f=>{const i=$("#sc-new"),v=i.value.trim();if(!v)return;S.scorecard.push({t:v,r:""});save();renderSheet();$("#sc-new")?.focus()},
  level:f=>{const h=S.habits.find(x=>x.id===f.dataset.id),v=$("#lv-new").value.trim();if(!v){toast("Beschrijf eerst de volgende versie");return}
    h.level=(h.level||1)+1;(h.levels=h.levels||[]).push({lv:h.level,v,at:today()});save();renderSheet();toast("Level "+h.level+". Net buiten je comfortzone.")},
  review:f=>{const a={};REVIEW_Q.forEach(([k])=>{a[k]=(RV[k]||"").trim()});if(!Object.values(a).some(Boolean)){toast("Beantwoord minstens één vraag");return}
    const {ws,rows}=weekStats();S.reviews.unshift({week:ws,date:today(),a,stats:rows.map(r=>({n:r.h.name,v:r.n}))});RV={};save();render();window.scrollTo(0,0);toast("Review opgeslagen. Volgende week weer.")}
};

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el,el.dataset.id,e)}});
document.addEventListener("submit",e=>{e.preventDefault();const f=FORMS[e.target.dataset.form];if(f)f(e.target)});
document.addEventListener("input",e=>{const t=e.target,ds=t.dataset;
  if(ds.ans!==undefined){S.answers[ds.ans]=t.value;saveSoon()}
  if(ds.wf!==undefined&&W){W.data[ds.wf]=t.value}
  if(ds.ob!==undefined){OB[ds.ob]=t.value}
  if(ds.rv!==undefined){RV[ds.rv]=t.value}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&SH)closeSheet()});
window.addEventListener("hashchange",()=>{if(SH)closeSheet();else render();window.scrollTo(0,0)});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!SH)render()});
render();
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
